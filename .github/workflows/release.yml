name: Publish

on:
    schedule:
        - cron: "0 0 * * *"
    workflow_dispatch:
        inputs:
            force:
                description: "Force release version"
                required: false
                type: boolean
                default: false

permissions:
    contents: read
    packages: write

env:
    IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tinyproxy
    LOCAL_IMAGE_NAME: localhost/tinyproxy
    X_TINYPROXY_VERSION: ""

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Check if release is needed
              id: version
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
                  FORCE: ${{ github.event.inputs.force }}
              run: |
                  find . -type f -name "*.sh" -exec chmod +x {} \;
                  version=$(./needs_release.sh)
                  echo "X_TINYPROXY_VERSION=$version" >> $GITHUB_ENV

            - name: Build image
              if: ${{ env.X_TINYPROXY_VERSION != '' }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  TINYPROXY_VERSION: ${{ env.X_TINYPROXY_VERSION }}
              run: ./build.sh

            - name: Login to GHCR
              uses: redhat-actions/podman-login@v1
              if: ${{ env.X_TINYPROXY_VERSION != '' }}
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}

            - name: Publish image to GHCR
              if: ${{ env.X_TINYPROXY_VERSION != '' }}
              run: |
                  podman manifest push --all ${{ env.LOCAL_IMAGE_NAME }}:${{ env.X_TINYPROXY_VERSION }} ${{ env.IMAGE_NAME }}:${{ env.X_TINYPROXY_VERSION }}
                  podman manifest push --all ${{ env.LOCAL_IMAGE_NAME }}:${{ env.X_TINYPROXY_VERSION }} ${{ env.IMAGE_NAME }}:latest
